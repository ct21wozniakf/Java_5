<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        h1{
            text-decoration: underline wavy red;
        }
        input{
            width: 100px;
        }
        div{
            padding: 10px;
            border: 4px double red;
            display: inline-block;
        }
        table{
            border-collapse: collapse;
        }
        td{
            border: 3px solid pink;
        }
    </style>
</head>
<body>

    <h1>Generator Tabel HTML</h1>
    <div>
        <span>
            <label for="mini">Liczba kolumn</label>
            <input type="number" name="kol" id="mini" min="0" max="500" placeholder="max: 500">
            <label for="maxi">Liczba wierszy</label>
            <input type="number" name="wier" id="maxi" min="0" max="500" placeholder="max: 500">
            <button id="psycisk">Generuj</button>
        </span>

    </div>
    <br>
    <table id="tabela"></table>



    <script src="generator_tabel.js"></script>
</body>
</html>
